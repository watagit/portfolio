name: Visual Regression Testing

on:
  deployment_status:

jobs:
  visual-test:
    # Only run when Vercel deployment is successful
    if: github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success' && github.event.deployment_status.environment == 'Preview'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - id: nvm
        run: echo "nvmrc=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ steps.nvm.outputs.nvmrc }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm playwright install chromium --with-deps

      - name: Run visual regression tests
        env:
          BASE_URL: ${{ github.event.deployment_status.target_url }}
        run: pnpm playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload screenshots to Argos
        continue-on-error: true
        run: |
          pnpm exec argos upload ./screenshots --token=${{ secrets.ARGOS_TOKEN }}
        if: always()
